[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "4kitten-mixed_precision_overflow_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列具身智能算法工程师·混合精度的溢出与下溢的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "4kitten" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://4kitten.github.io"
Repository = "https://github.com/4kitten/mixed_precision_overflow_timeline_score"
Issues = "https://github.com/4kitten/mixed_precision_overflow_timeline_score/issues"

[project.scripts]
mixed_precision_overflow_timeline_score = "mixed_precision_overflow_timeline_score:main"

[tool.setuptools]
py-modules = ["mixed_precision_overflow_timeline_score"]
